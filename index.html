<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conway's Game of Life - Galaxy Mode</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }
    h1 {
      margin: 20px 0 10px;
    }
    canvas {
      background: #222;
      display: block;
      margin: 10px auto;
      border: 1px solid #444;
      cursor: crosshair;
      touch-action: none;
      max-width: 90vw;
      height: auto;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 10px auto 20px;
      max-width: 95vw;
    }
    button, select, label {
      padding: 10px 20px;
      font-weight: bold;
      background: #ff0;
      border: none;
      color: #000;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 5px #ff0b;
      transition: background 0.2s;
    }
    button:hover, select:hover, label:hover {
      background: #cc0;
    }
    #colorSelector {
      display: inline-block;
    }
    @media (max-width: 600px) {
      canvas {
        width: 90vw !important;
        height: 90vw !important;
      }
    }
  </style>
</head>
<body>
  <h1>⚙️ Conway's Game of Life</h1>
  <canvas id="game"></canvas>
  <div class="controls">
    <button onclick="toggleRunning()">▶️ Start / ⏸ Pause</button>
    <button onclick="clearGrid()">🧹 Clear</button>
    <button onclick="randomGrid()">🔀 Random Pattern</button>
    <button onclick="toggleGalaxyMode()">🌌 Toggle Galaxy Mode</button>
    <label id="colorSelector">
      🎨 Pick Color: <input type="color" id="colorPicker" value="#00ffff" onchange="setColor(this.value)" />
    </label>
    <label>
      ⏱ Speed:
      <select id="speedControl" onchange="setSpeed(this.value)">
        <option value="200">0.25x</option>
        <option value="100">0.5x</option>
        <option value="50" selected>1x</option>
        <option value="25">1.5x</option>
        <option value="10">2x</option>
      </select>
    </label>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let size = 10;
    let cols, rows;
    let grid;
    let running = false;
    let dragging = false;
    let speed = 50;
    let galaxyMode = false;
    let cellColor = "#00ffff";

    function resizeCanvas() {
      const minDim = Math.min(window.innerWidth, window.innerHeight) * 0.9;
      canvas.width = minDim;
      canvas.height = minDim;
      cols = Math.floor(canvas.width / size);
      rows = Math.floor(canvas.height / size);
      grid = createGrid();
      drawGrid();
    }

    function createGrid() {
      return Array.from({ length: rows }, () => Array(cols).fill(0));
    }

    function toggleCell(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / size);
      const y = Math.floor((e.clientY - rect.top) / size);
      if (x >= 0 && x < cols && y >= 0 && y < rows) {
        grid[y][x] = 1;
        drawGrid();
      }
    }

    canvas.addEventListener("mousedown", e => {
      dragging = true;
      toggleCell(e);
    });
    canvas.addEventListener("mouseup", () => dragging = false);
    canvas.addEventListener("mousemove", e => {
      if (dragging) toggleCell(e);
    });

    canvas.addEventListener("touchstart", e => {
      dragging = true;
      toggleCell(e.touches[0]);
    });
    canvas.addEventListener("touchmove", e => {
      if (dragging) toggleCell(e.touches[0]);
    });
    canvas.addEventListener("touchend", () => dragging = false);

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x]) {
            if (galaxyMode) {
              const hue = Math.floor(Math.random() * 360);
              ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = ctx.fillStyle;
            } else {
              ctx.fillStyle = cellColor;
              ctx.shadowBlur = 10;
              ctx.shadowColor = cellColor;
            }
            ctx.fillRect(x * size, y * size, size - 1, size - 1);
            ctx.shadowBlur = 0;
          }
        }
      }
    }

    function updateGrid() {
      const next = createGrid();
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let neighbors = 0;
          for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
              if (i === 0 && j === 0) continue;
              const ny = y + i;
              const nx = x + j;
              if (ny >= 0 && ny < rows && nx >= 0 && nx < cols) {
                neighbors += grid[ny][nx];
              }
            }
          }
          if (grid[y][x] && (neighbors === 2 || neighbors === 3)) next[y][x] = 1;
          else if (!grid[y][x] && neighbors === 3) next[y][x] = 1;
        }
      }
      grid = next;
      drawGrid();
    }

    function toggleRunning() {
      running = !running;
    }

    function clearGrid() {
      grid = createGrid();
      drawGrid();
    }

    function randomGrid() {
      grid = Array.from({ length: rows }, () =>
        Array.from({ length: cols }, () => (Math.random() > 0.8 ? 1 : 0))
      );
      drawGrid();
    }

    function setSpeed(val) {
      speed = parseInt(val);
    }

    function toggleGalaxyMode() {
      galaxyMode = !galaxyMode;
      const colorSel = document.getElementById("colorSelector");
      colorSel.style.display = galaxyMode ? "none" : "inline-block";
      drawGrid();
    }

    function setColor(value) {
      cellColor = value;
    }

    function loop() {
      if (running) updateGrid();
      setTimeout(loop, speed);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    loop();
  </script>
</body>
</html>
